name: Verificação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gai
          POSTGRES_PASSWORD: gai-ci
          POSTGRES_DB: gai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gai -d gai_test"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run build
      - name: Integração com SQLite
        run: PYTHONPATH=backend python -m unittest discover -s tests -v
      - name: Integração com PostgreSQL
        env:
          GAI_TEST_DATABASE_URL: postgresql+psycopg://gai:gai-ci@127.0.0.1:5432/gai_test
        run: PYTHONPATH=backend python -m unittest discover -s tests -v
      - run: docker compose config --quiet
